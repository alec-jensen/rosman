[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosman"
version = "0.0.0"  # unreleased; 0.0.1 gets tagged once there's a stable working base
description = "Run ROS 2 anywhere, without installing it natively — a transparent Docker-backed ROS 2 environment manager."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alec Jensen" }]
keywords = ["ros2", "docker", "robotics", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "PyYAML>=6.0",
    "docker>=7.1.0",
    "rich>=13.7.0",
]

[project.scripts]
rosman = "rosman.cli:main"

[project.urls]
Homepage = "https://github.com/alec-jensen/rosman"
Issues = "https://github.com/alec-jensen/rosman/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rosman"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
